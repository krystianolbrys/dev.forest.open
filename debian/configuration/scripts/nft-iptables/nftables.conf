#!/usr/sbin/nft -f

#/etc/nftables.conf
# -rwxr-xr-x 1 root root 9171 Jul  2 18:25 /etc/nftables.conf

#
# Host firewall compatible with nftables + iptables-nft + Docker + libvirt
#
# IMPORTANT:
# - no flush ruleset
# - no table ip filter
# - no table ip nat
# - no FORWARD hook
# - Docker/libvirt/iptables-nft may manage their own tables/chains
#

destroy table inet hostfw

table inet hostfw {

    chain prerouting {
        type filter hook prerouting priority filter; policy accept;

        counter accept
    }

    chain input {
        type filter hook input priority filter; policy drop;

        # localhost
        iifname "lo" counter accept

        # conntrack hygiene
        ct state invalid counter drop
        ct state established,related counter accept

        # Drop IPv6 on host input
        meta nfproto ipv6 counter drop

        # Log new incoming IPv4 traffic before drop
        meta nfproto ipv4 ct state new limit rate 10/minute burst 20 packets \
            log prefix "NFT INPUT NEW DROP: " flags all counter drop

        # Final drop
        counter drop
    }

    chain output {
        type filter hook output priority filter; policy drop;

        # localhost
        oifname "lo" counter accept

        # conntrack hygiene
        ct state invalid counter drop
        ct state established,related counter accept

        # Drop IPv6 on host output
        meta nfproto ipv6 counter drop

        # Allow new outgoing IPv4 connections from host
        meta nfproto ipv4 ct state new counter accept

        # Final drop
        counter drop
    }

    chain forward {
        type filter hook forward priority filter; policy accept;

        counter accept
    }

    chain postrouting {
        type filter hook postrouting priority filter; policy accept;

        counter accept
    }
}
